name: build

on:
  push:
    branches: [main, PROD]
    tags: ['v*']
  pull_request:
    branches: [main, PROD]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Nomes SEM versão: são o alvo dos links permanentes
  # https://github.com/<owner>/<repo>/releases/latest/download/<nome>
  # que sempre apontam para o release mais recente. Se a versão entrar no nome
  # do arquivo, esses links quebram a cada release.
  EXE_NAME: 2G-GPS-Cliente.exe
  ZIP_NAME: 2G-GPS-Cliente.zip
  SETUP_NAME: 2G-GPS-Cliente-Setup.exe

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Derive version
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            "1.0.0-ci.$($env:GITHUB_RUN_NUMBER)"
          }
          echo "VERSION=$v" >> $env:GITHUB_ENV
          echo "Versão: $v"

      - name: Test
        run: dotnet test tests/TwoG.GpsClient.Core.Tests/TwoG.GpsClient.Core.Tests.csproj -c Release

      # Produz UM único .exe autocontido: as opções de single-file estão no csproj
      # (PublishSingleFile, SelfContained, IncludeNativeLibrariesForSelfExtract,
      # EnableCompressionInSingleFile) junto com RuntimeIdentifier=win-x64.
      - name: Publish (single-file)
        run: >
          dotnet publish src/TwoG.GpsClient/TwoG.GpsClient.csproj
          -c Release
          -p:PublishReadyToRun=true
          -p:Version=${{ env.VERSION }}
          -o publish

      - name: Verify single-file output
        shell: pwsh
        run: |
          $files = Get-ChildItem publish -File
          $files | Format-Table Name, Length
          if ($files.Count -ne 1 -or $files[0].Name -ne $env:EXE_NAME) {
            throw "Esperado exatamente 1 arquivo ($env:EXE_NAME), obtido: $($files.Name -join ', ')"
          }

      - name: Compile installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
          }
          iscc .\installer\setup.iss /DAppVersion="${{ env.VERSION }}"

      - name: Stage release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "publish\$env:EXE_NAME" "dist\$env:EXE_NAME"
          Compress-Archive -Path "publish\$env:EXE_NAME" -DestinationPath "dist\$env:ZIP_NAME" -Force
          if (-not (Test-Path "dist\$env:SETUP_NAME")) {
            throw "Instalador não encontrado em dist\$env:SETUP_NAME"
          }
          # Checksums para quem quiser conferir o download
          Get-FileHash "dist\*" -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Set-Content -Path dist\SHA256SUMS.txt -Encoding ascii
          Get-ChildItem dist | Format-Table Name, Length
          Get-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v5
        with:
          name: 2G-GPS-Cliente-${{ env.VERSION }}
          path: dist/*
          if-no-files-found: error

      # Tags v* publicam o Release. Tags com hífen (v1.1.0-beta.1) entram como
      # pré-release e NÃO assumem o "latest", preservando os links permanentes.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          name: ${{ github.ref_name }}
          body: |
            ## Download

            | Arquivo | Para quem |
            |---|---|
            | [`2G-GPS-Cliente.exe`](https://github.com/${{ github.repository }}/releases/latest/download/2G-GPS-Cliente.exe) | **Recomendado** — executável único, sem instalação |
            | [`2G-GPS-Cliente.zip`](https://github.com/${{ github.repository }}/releases/latest/download/2G-GPS-Cliente.zip) | Mesmo executável, compactado |
            | [`2G-GPS-Cliente-Setup.exe`](https://github.com/${{ github.repository }}/releases/latest/download/2G-GPS-Cliente-Setup.exe) | Instalador com atalho no Menu Iniciar e desinstalador |

            Requer Windows 10/11 x64 e MSFS 2020 ou 2024. Não precisa do runtime .NET.

            > Ao abrir pela primeira vez o Windows pode exibir *"O Windows protegeu seu
            > computador"* (executável sem assinatura digital): clique em
            > **Mais informações → Executar assim mesmo**.
