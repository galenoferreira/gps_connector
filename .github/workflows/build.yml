name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Derive version
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            "1.0.0-ci.$($env:GITHUB_RUN_NUMBER)"
          }
          echo "VERSION=$v" >> $env:GITHUB_ENV

      - name: Test
        run: dotnet test tests/TwoG.GpsClient.Core.Tests -c Release

      - name: Publish (self-contained win-x64)
        run: >
          dotnet publish src/TwoG.GpsClient/TwoG.GpsClient.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishReadyToRun=true
          -p:Version=${{ env.VERSION }}
          -o publish

      - name: Compile installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
          }
          iscc .\installer\setup.iss /DAppVersion="${{ env.VERSION }}"

      - name: Package portable zip
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath "dist\2G-GPS-Cliente-portable-${{ env.VERSION }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: 2G-GPS-Cliente-${{ env.VERSION }}
          path: dist/*
          if-no-files-found: error

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
