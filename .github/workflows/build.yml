name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Derive version
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            "1.0.0-ci.$($env:GITHUB_RUN_NUMBER)"
          }
          echo "VERSION=$v" >> $env:GITHUB_ENV

      - name: Test
        run: dotnet test tests/TwoG.GpsClient.Core.Tests/TwoG.GpsClient.Core.Tests.csproj -c Release

      # Produz UM único .exe autocontido: as opções de single-file estão no csproj
      # (PublishSingleFile, SelfContained, IncludeNativeLibrariesForSelfExtract,
      # EnableCompressionInSingleFile) junto com RuntimeIdentifier=win-x64.
      - name: Publish (single-file)
        run: >
          dotnet publish src/TwoG.GpsClient/TwoG.GpsClient.csproj
          -c Release
          -p:PublishReadyToRun=true
          -p:Version=${{ env.VERSION }}
          -o publish

      - name: Verify single-file output
        shell: pwsh
        run: |
          $files = Get-ChildItem publish -File
          $files | Format-Table Name, Length
          if ($files.Count -ne 1 -or $files[0].Name -ne '2G-GPS-Cliente.exe') {
            throw "Esperado exatamente 1 arquivo (2G-GPS-Cliente.exe), obtido: $($files.Name -join ', ')"
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item publish\2G-GPS-Cliente.exe "dist\2G-GPS-Cliente-$($env:VERSION).exe"

      - name: Compile installer (opcional, para quem prefere atalhos/desinstalador)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
          }
          iscc .\installer\setup.iss /DAppVersion="${{ env.VERSION }}"

      - uses: actions/upload-artifact@v4
        with:
          name: 2G-GPS-Cliente-${{ env.VERSION }}
          path: dist/*
          if-no-files-found: error

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
